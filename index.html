<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASTROFIZZZ UTILITIES HUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #f2f5ff;
    --space: #05060d;
    --glow: #7cc4ff;
    --glow-soft: rgba(124, 196, 255, 0.55);
    --glass: rgba(14, 18, 36, 0.45);
    --edge: rgba(190, 215, 255, 0.28);
    --cycle: 40s; /* total loop: 5 images x 8s each */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    color: var(--ink);
    background: var(--space);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ---------- Background slideshow (pan + crossfade) ---------- */
  .bg {
    position: fixed;
    inset: 0;
    z-index: -2;
    overflow: hidden;
    background: var(--space);
  }
  .bg .slide {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    opacity: 0;
    animation: pan var(--cycle) linear infinite;
    will-change: transform, opacity;
  }
  /* >>> CHANGE THE BACKGROUND IMAGE ADDRESSES HERE <<< */
  .bg .s1 { background-image: url("https://i.ibb.co/HTJmgc45/2026-06-19-13-28-23.png"); animation-delay: 0s;  --x1: -3%; --y1: -2%; }
  .bg .s2 { background-image: url("https://i.ibb.co/WpPrYJh8/2026-04-19-19-19-22.png"); animation-delay: 8s;  --x1: 3%;  --y1: -2%; }
  .bg .s3 { background-image: url("https://i.ibb.co/HTHVX2j2/2026-04-19-19-16-25.png"); animation-delay: 16s; --x1: -3%; --y1: 2%; }
  .bg .s4 { background-image: url("https://i.ibb.co/Y4HLwj8z/2025-07-13-23-07-40.png"); animation-delay: 24s; --x1: 3%;  --y1: 2%; }
  .bg .s5 { background-image: url("https://i.ibb.co/fdj6tZL8/2025-10-05-16-52-33.png"); animation-delay: 32s; --x1: 0%;  --y1: -3%; }

  /* Each slide gets 8s (20% of the loop): fades in, slowly pans/zooms, fades out while the next fades in */
  @keyframes pan {
    0%   { opacity: 0; transform: scale(1.08) translate(0, 0); }
    5%   { opacity: 1; }
    20%  { opacity: 1; }
    25%  { opacity: 0; transform: scale(1.22) translate(var(--x1), var(--y1)); }
    100% { opacity: 0; transform: scale(1.22) translate(var(--x1), var(--y1)); }
  }

  /* Dark gradient overlay keeps text readable over any image */
  .bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(5, 6, 13, 0.15), rgba(5, 6, 13, 0.75) 80%),
      linear-gradient(to bottom, rgba(5, 6, 13, 0.35), rgba(5, 6, 13, 0.7));
  }

  /* ---------- Hero ---------- */
  .hero {
    min-height: 52vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 5rem 1.5rem 2.5rem;
  }
  .hero h1 {
    font-weight: 700;
    font-size: clamp(2.2rem, 7.5vw, 6rem);
    line-height: 1.02;
    letter-spacing: 0.04em;
    text-shadow: 0 0 40px rgba(124, 196, 255, 0.35), 0 2px 30px rgba(0, 0, 0, 0.6);
  }
  .hero p {
    margin-top: 1.4rem;
    max-width: 34rem;
    font-weight: 300;
    font-size: clamp(1.2rem, 2.4vw, 1.5rem);
    line-height: 1.6;
    color: rgba(242, 245, 255, 0.78);
  }

  /* ---------- Buttons ---------- */
  main { padding: 0 1.5rem 6rem; }
  .grid {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr));
    gap: 1.75rem;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 150px;
    padding: 1.2rem;
    text-decoration: none;
    color: var(--ink);
    font-family: inherit;
    font-weight: 600;
    font-size: 1.7rem;
    border-radius: 20px;
    background: var(--glass);
    border: 1px solid var(--edge);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    transition: transform 0.28s ease, box-shadow 0.28s ease, border-color 0.28s ease, background 0.28s ease;
  }
  .btn:hover,
  .btn:focus-visible {
    transform: scale(1.06);
    border-color: var(--glow);
    background: rgba(24, 32, 62, 0.55);
    box-shadow: 0 0 18px var(--glow-soft), 0 0 46px rgba(124, 196, 255, 0.25);
    outline: none;
  }
  .btn:active { transform: scale(1.02); }

  footer {
    text-align: center;
    padding: 0 1rem 3rem;
    font-size: 0.85rem;
    font-weight: 300;
    color: rgba(242, 245, 255, 0.5);
  }

  @media (prefers-reduced-motion: reduce) {
    .bg .slide { animation: none; }
    .bg .s1 { opacity: 1; }
    .btn { transition: none; }
  }
</style>
</head>
<body>

<!-- Background slideshow: edit the image URLs in the CSS above (.s1 to .s5) -->

  <div class="slide s4"></div>
  <div class="slide s5"></div>
</div>

<header class="hero">
  <h1>ASTROFIZZZ UTILITIES HUB</h1>
  <p>Tools and utilities, all in one place.</p>
</header>

<main>

</html>
